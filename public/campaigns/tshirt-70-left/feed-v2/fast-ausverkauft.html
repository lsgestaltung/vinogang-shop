<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Fast Ausverkauft</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
    }

    .container {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .background-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0.6;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.4) 0%,
        rgba(0,0,0,0.2) 40%,
        rgba(0,0,0,0.8) 100%
      );
    }

    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 50px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .logo {
      width: 140px;
    }

    .tag {
      background: transparent;
      border: 2px solid #DDB55B;
      color: #DDB55B;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding: 10px 20px;
    }

    .diagonal-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      text-align: center;
      width: 120%;
    }

    .diagonal-main {
      font-size: 140px;
      font-weight: 900;
      color: #DDB55B;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 0.9;
      text-shadow: 0 0 80px rgba(221,181,91,0.4);
    }

    .diagonal-sub {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5em;
      margin-top: 20px;
    }

    .bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .product-info {
      text-align: left;
    }

    .product-label {
      font-size: 14px;
      font-weight: 700;
      color: #DDB55B;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stock-info {
      text-align: right;
    }

    .stock-number {
      font-size: 72px;
      font-weight: 900;
      color: #DDB55B;
      line-height: 1;
    }

    .stock-label {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .line-accent {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: #DDB55B;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/images/models/lookbook/barrel/male-3.jpg" class="background-image" alt="">
    <div class="overlay"></div>

    <div class="content">
      <div class="top">
        <img src="/images/logo/logo-gold.png" class="logo" alt="Vinogang">
        <div class="tag">Clothing</div>
      </div>

      <div class="diagonal-text">
        <div class="diagonal-main">Fast<br>Weg</div>
        <div class="diagonal-sub">Nicht verpassen</div>
      </div>

      <div class="bottom">
        <div class="product-info">
          <div class="product-label">Collection</div>
          <div class="product-name">Vinogang Shirts</div>
        </div>
        <div class="stock-info">
          <div class="stock-number">70</div>
          <div class="stock-label">Noch übrig</div>
        </div>
      </div>
    </div>

    <div class="line-accent"></div>
  </div>
</body>
</html>
