<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Letzte Chance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
    }

    .container {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .split {
      display: flex;
      height: 100%;
    }

    .left {
      width: 50%;
      position: relative;
      overflow: hidden;
    }

    .left-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .left-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.3) 100%);
    }

    .right {
      width: 50%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      position: relative;
    }

    .logo {
      position: absolute;
      top: 50px;
      right: 50px;
      width: 120px;
    }

    .main-text {
      margin-bottom: 40px;
    }

    .headline {
      font-size: 64px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 15px;
    }

    .headline span {
      color: #DDB55B;
    }

    .subline {
      font-size: 18px;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.3em;
    }

    .counter {
      display: flex;
      align-items: baseline;
      gap: 15px;
      margin-bottom: 40px;
      padding: 30px 0;
      border-top: 1px solid rgba(221,181,91,0.3);
      border-bottom: 1px solid rgba(221,181,91,0.3);
    }

    .counter-number {
      font-size: 120px;
      font-weight: 900;
      color: #DDB55B;
      line-height: 1;
    }

    .counter-text {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .cta {
      display: inline-block;
      background: #DDB55B;
      color: #000;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding: 22px 45px;
    }

    .url {
      margin-top: 30px;
      font-size: 14px;
      font-weight: 700;
      color: #DDB55B;
      letter-spacing: 0.1em;
    }

    .gold-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      background: #DDB55B;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="split">
      <div class="left">
        <img src="/images/models/lookbook/communion/female-1.jpg" class="left-image" alt="">
        <div class="left-overlay"></div>
      </div>
      <div class="right">
        <div class="gold-line"></div>
        <img src="/images/logo/logo-gold.png" class="logo" alt="Vinogang">

        <div class="main-text">
          <div class="headline">Letzte<br><span>Chance</span></div>
          <div class="subline">Bevor es zu spät ist</div>
        </div>

        <div class="counter">
          <div class="counter-number">70</div>
          <div class="counter-text">Shirts<br>noch da</div>
        </div>

        <div class="cta">Jetzt shoppen</div>
        <div class="url">clothing.vinogang.com</div>
      </div>
    </div>
  </div>
</body>
</html>
